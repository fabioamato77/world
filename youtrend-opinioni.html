<title>Cosa pensano gli elettori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e3e3e3;--dem:#1d5fa8;--dem-l:#9db9db;--rep:#c23b2e;--rep-l:#e2a49d;--none:#e8e8e8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink)}
  .box{max-width:820px;margin:0 auto;padding:14px 12px 10px}
  h1{font-family:"Fraunces",serif;font-weight:700;font-size:clamp(19px,4.4vw,26px);line-height:1.1;letter-spacing:-.01em}
  .sub{font-size:clamp(12px,2.8vw,14px);color:var(--muted);margin-top:4px;line-height:1.35}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;font:600 11.5px "IBM Plex Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#fff;border:1px solid #d6d6d6;border-radius:99px;padding:6px 13px;cursor:pointer;transition:background .15s,color .15s}
  .tabs button:hover{background:#f4f4f4}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tabs button:focus-visible{outline:2px solid var(--dem);outline-offset:2px}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .logo{flex:none;height:clamp(22px,5.6vw,30px);width:auto;opacity:.55;margin-top:2px}
  .lead{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(15px,3.6vw,18px);line-height:1.3;margin:12px 0 4px;max-width:640px}
  .legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:10px 0 2px;align-items:center}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
  .foot{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;line-height:1.45}
  .tip{position:fixed;z-index:9;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.4;max-width:240px;display:none}
  .tip b{font-family:"Fraunces",serif;font-size:14px;display:block;margin-bottom:2px}
  .tip .d{color:var(--dem);font-weight:600} .tip .r{color:var(--rep);font-weight:600}
  @media (prefers-reduced-motion:no-preference){.fadein{animation:fi .6s both}@keyframes fi{from{opacity:0}to{opacity:1}}}

  .q{margin:20px 0 0}
  .q h3{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(14.5px,3.5vw,16.5px);line-height:1.25}
  .sb{display:flex;height:clamp(30px,7vw,38px);margin-top:7px;border-radius:5px;overflow:hidden;background:var(--none)}
  .sb i{font-style:normal;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(12px,3.3vw,15px);color:#fff;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1);overflow:hidden;white-space:nowrap;border-right:1.5px solid #fff}
  .sb i:last-child{border-right:0}
  .ky{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:6px;font-size:12px;color:#444}
  .ky span b{font-family:"IBM Plex Mono",monospace;font-weight:600;margin-left:3px;color:var(--ink)}
  .ky em{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .rk{margin-top:8px}
  .rk div{display:grid;grid-template-columns:clamp(96px,28vw,150px) 1fr;align-items:center;gap:10px;margin-top:5px;font-size:13px}
  .rk div span{display:block;height:22px;position:relative}
  .rk div span i{display:block;height:100%;width:0;background:#cdbfe9;background:var(--ink);opacity:.28;border-radius:3px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .rk div:first-child span i{opacity:1}
  .rk div span b{position:absolute;top:50%;transform:translateY(-50%);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;padding-left:6px}
  @media (prefers-reduced-motion:reduce){.sb i,.rk div span i{transition:none}}
</style>
</head>

const fmtM = m => m == null ? "n.d." : m === 0 ? "pari" : (m > 0 ? "D+" : "R+") + Math.abs(m);
const tip = document.getElementById("tip");
function showTip(html, ev){ tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev){ const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 6) x = ev.clientX - w - 14; if (y + h > innerHeight - 6) y = ev.clientY - h - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px"; }
function hideTip(){ tip.style.display = "none"; }
if (new URLSearchParams(location.search).get("senzatitolo") === "1") { const h = document.querySelector(".box h1"); if (h) h.style.display = "none"; const lg = document.querySelector(".logo"); if (lg) lg.style.display = "none"; }

const Q = {"Trump": {"lead": "Il 62% degli elettori disapprova l'operato di Trump; il 43% ha votato anche per opporsi a lui, solo il 16% per sostenerlo.", "qs": [{"q": "Approva l'operato di Trump come presidente?", "o": [["Approva", 38], ["Disapprova", 62]]}, {"q": "Trump si batte per le persone come lei?", "o": [["Sì", 38], ["No", 62]]}, {"q": "Trump ha le priorità giuste?", "o": [["Sì", 37], ["No", 63]]}, {"q": "Trump mette al primo posto…", "o": [["I suoi interessi personali", 61], ["Gli interessi del Paese", 39]]}, {"q": "Con il suo voto per la Camera ha voluto anche…", "o": [["Opporsi a Trump", 43], ["Trump non ha contato", 41], ["Sostenere Trump", 16]]}]}, "Umore": {"lead": "Tre elettori su quattro sono arrabbiati o insoddisfatti; per il 57% la prossima generazione starà peggio. L'economia è il primo problema.", "qs": [{"q": "Come si sente per come vanno le cose negli Stati Uniti?", "o": [["Arrabbiato", 38], ["Insoddisfatto", 37], ["Soddisfatto", 18], ["Entusiasta", 7]]}, {"q": "La vita della prossima generazione di americani sarà…", "o": [["Migliore", 22], ["Uguale", 22], ["Peggiore", 57]]}, {"q": "Qual è il problema più importante per il Paese?", "rank": [["Economia", 39], ["Democrazia", 32], ["Immigrazione", 14], ["Sanità", 8], ["Politica estera", 4], ["Criminalità", 3]]}]}, "Economia": {"lead": "Per il 75% l'economia non va bene e il 44% sta peggio di due anni fa. Il costo della vita è stato decisivo per quasi un elettore su due.", "qs": [{"q": "Come giudica la situazione economica del Paese?", "o": [["Ottima", 2], ["Buona", 23], ["Non molto buona", 40], ["Cattiva", 35]]}, {"q": "La situazione economica della sua famiglia è…", "o": [["Migliore di due anni fa", 18], ["Più o meno la stessa", 38], ["Peggiore di due anni fa", 44]]}, {"q": "Chi è più capace di gestire l'economia?", "o": [["Democratici", 43], ["Repubblicani", 38], ["Nessuno dei due", 20]], "col": ["#1d5fa8", "#c23b2e", "#a9a9a9"]}, {"q": "Quanto ha contato il costo della vita nel suo voto?", "o": [["Decisivo", 49], ["Un fattore importante", 39], ["Un fattore secondario", 10], ["Non ha contato", 1]]}]}, "Prezzi e dazi": {"lead": "Bollette e benzina preoccupano la grande maggioranza degli elettori e per il 65% i dazi di Trump sono stati un danno per l'economia nazionale.", "qs": [{"q": "Quanto la preoccupa il costo delle bollette?", "o": [["Molto", 54], ["Abbastanza", 32], ["Poco", 11], ["Per niente", 3]]}, {"q": "Quanto la preoccupano i prezzi di benzina e gasolio?", "o": [["Molto", 59], ["Abbastanza", 28], ["Poco", 9], ["Per niente", 3]]}, {"q": "Per l'economia nazionale, i dazi di Trump…", "o": [["Sono stati un danno", 65], ["Non hanno inciso", 13], ["Sono stati un aiuto", 22]]}, {"q": "Per l'economia della sua zona, i dazi di Trump…", "o": [["Sono stati un danno", 63], ["Non hanno inciso", 22], ["Sono stati un aiuto", 15]]}]}, "Aborto e sanità": {"lead": "Per il 63% l'aborto dovrebbe essere legale; per il 54% con le politiche di Trump i costi della sanità sono peggiorati.", "qs": [{"q": "L'aborto dovrebbe essere…", "o": [["Legale", 63], ["Illegale", 37]]}, {"q": "Con le politiche di Trump, i costi della sanità sono…", "o": [["Migliorati", 10], ["Rimasti uguali", 36], ["Peggiorati", 54]]}]}, "Esteri": {"lead": "Per il 50% il sostegno degli Stati Uniti a Israele è eccessivo; la guerra con l'Iran ha avuto un peso rilevante per il 74%.", "qs": [{"q": "Il sostegno degli Stati Uniti a Israele è…", "o": [["Eccessivo", 50], ["Adeguato", 37], ["Insufficiente", 13]]}, {"q": "Quanto ha contato la guerra con l'Iran nel suo voto?", "o": [["Decisiva", 34], ["Un fattore importante", 40], ["Un fattore secondario", 19], ["Non ha contato", 7]]}]}}; const INK = ["#1a1a1a", "#6e6e6e", "#a9a9a9", "#d6d6d6"];
const KEYS = Object.keys(Q);
function show(i){
  const g = Q[KEYS[i]];
  document.getElementById("lead").textContent = g.lead;
  const box = document.getElementById("qs"); box.innerHTML = "";
  const todo = [];
  g.qs.forEach(q => {
    const el = document.createElement("div"); el.className = "q";
    el.innerHTML = "<h3>" + q.q + "</h3>";
    if (q.rank){
      const rk = document.createElement("div"); rk.className = "rk";
      q.rank.forEach(([n, v]) => { rk.insertAdjacentHTML("beforeend", "<div>" + n + '<span><i></i><b>' + v + "%</b></span></div>"); });
      el.appendChild(rk); todo.push(() => { const mx = q.rank[0][1]; rk.querySelectorAll("span").forEach((s, k) => {
        const w = q.rank[k][1] / mx * 88; s.firstChild.style.width = w + "%"; s.lastChild.style.left = w + "%"; }); });
    } else {
      const cols = q.col || INK;
      const sb = document.createElement("div"); sb.className = "sb";
      q.o.forEach(([n, v], k) => { const s = document.createElement("i"); s.style.background = cols[k]; s.style.color = k >= 2 && !q.col ? "#1a1a1a" : "#fff"; s.textContent = v >= 7 ? v + "%" : ""; sb.appendChild(s); });
      const ky = document.createElement("div"); ky.className = "ky";
      q.o.forEach(([n, v], k) => { ky.insertAdjacentHTML("beforeend", '<span><em style="background:' + cols[k] + '"></em>' + n + "<b>" + v + "%</b></span>"); });
      el.appendChild(sb); el.appendChild(ky);
      todo.push(() => { [...sb.children].forEach((s, k) => s.style.width = q.o[k][1] + "%"); });
    }
    box.appendChild(el);
  });
  void box.offsetWidth;
  requestAnimationFrame(() => todo.forEach((f, k) => setTimeout(f, k * 70)));
  postSize();
}
makeTabs(document.getElementById("tabs"), KEYS, show, Math.max(0, KEYS.indexOf(new URLSearchParams(location.search).get("tab") || "Trump")));

postSize();
</script>
