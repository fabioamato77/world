name: Aggiorna dati Spagna
on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub non garantisce la puntualità: in pratica 5-15 min
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: spagna-dati
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 aggiorna_dati.py
      - name: Commit se cambiato
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add spagna-data.json
          git diff --cached --quiet || (git commit -m "dati: aggiornamento" && git push)
