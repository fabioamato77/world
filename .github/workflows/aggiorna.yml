name: Aggiorna dati Spagna
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: spagna-dati
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 aggiorna_dati.py --config fonte-newtral.json
      - name: Commit se cambiato
        run: |
          if [ ! -f spagna-data.json ]; then echo "Nessun dato ancora: niente da salvare"; exit 0; fi
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add spagna-data.json
          git diff --cached --quiet || (git commit -m "dati: aggiornamento" && git push)
