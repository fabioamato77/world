<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midterm Usa 2026, chi ha votato e perché</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e3e3e3;--dem:#1d5fa8;--rep:#c23b2e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
  .page{max-width:860px;margin:0 auto}
  .head{display:flex;align-items:baseline;gap:10px;padding:12px 14px 0;flex-wrap:wrap}
  .head h1{font-family:"Fraunces",serif;font-weight:700;font-size:clamp(17px,4.6vw,22px);letter-spacing:-.01em;line-height:1.1}
  .head span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .head.off{display:none}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--line)}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;font:600 12px "IBM Plex Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#fff;border:1px solid #d6d6d6;border-radius:99px;padding:7px 14px;cursor:pointer;transition:background .15s,color .15s}
  .tabs button:hover{background:#f4f4f4}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tabs button:focus-visible{outline:2px solid var(--dem);outline-offset:2px}
  .panes{position:relative}
  iframe{display:none;width:100%;border:0;background:#fff}
  iframe.on{display:block;animation:fi .35s both}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){iframe.on{animation:none}}
  .edbar{display:none;padding:7px 14px;background:#fffbe8;border-bottom:1px solid #eadf9c;font-size:12px;gap:8px;align-items:center;flex-wrap:wrap}
  .editor .edbar{display:flex}
  .edbar button{font:600 11.5px "IBM Plex Sans",sans-serif;border:1px solid #cfcfcf;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .edbar button:hover{background:#f4f4f4}
</style>
</head>
<body>
<div class="page" id="pg">
  <div class="edbar"><b>Modalità redazione</b>
    <button id="cpThis">Copia iframe di questa scheda</button><button id="cpPage">Copia iframe dello speciale</button><button id="cpScript">Copia script altezza</button><span id="cpMsg"></span></div>
  <div class="head" id="head"><h1>Midterm Usa 2026, chi ha votato e perché</h1><span>dati del 4 novembre</span></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Sezioni dello speciale"></div>
  <div class="panes" id="panes"></div>
</div>
<script>
const BLOCKS = [
  { id: "gruppi",      file: "youtrend-gruppi.html",      h: 560, t: "Chi ha votato" },
  { id: "spostamenti", file: "youtrend-spostamenti.html", h: 720, t: "Gli spostamenti" },
  { id: "opinioni",    file: "youtrend-opinioni.html",    h: 780, t: "Le opinioni" }
];
const q = new URLSearchParams(location.search);
if (q.get("editor") === "1") document.getElementById("pg").classList.add("editor");
if (q.get("titolo") === "0") document.getElementById("head").classList.add("off");
const base = new URL(".", location.href).href;
const tabsEl = document.getElementById("tabs"), panes = document.getElementById("panes");
const heights = {}, frames = {};
let current = null;

BLOCKS.forEach(b => {
  const btn = document.createElement("button");
  btn.type = "button"; btn.textContent = b.t; btn.id = "t-" + b.id; btn.setAttribute("role", "tab"); btn.setAttribute("aria-controls", "p-" + b.id);
  btn.onclick = () => show(b.id, true);
  tabsEl.appendChild(btn);
});

function show(id, user){
  const b = BLOCKS.find(x => x.id === id) || BLOCKS[0];
  current = b;
  BLOCKS.forEach(x => {
    const on = x.id === b.id, btn = document.getElementById("t-" + x.id);
    btn.classList.toggle("on", on); btn.setAttribute("aria-selected", on ? "true" : "false");
    if (frames[x.id]) frames[x.id].classList.toggle("on", on);
  });
  if (!frames[b.id]){                                   /* il blocco si carica solo la prima volta che lo apri */
    const f = document.createElement("iframe");
    f.id = "p-" + b.id; f.src = base + b.file + "?senzatitolo=1"; f.title = "Midterm Usa 2026, " + b.t; f.setAttribute("role", "tabpanel");
    f.style.height = (heights[b.id] || b.h) + "px"; f.className = "on";
    panes.appendChild(f); frames[b.id] = f;
  } else if (heights[b.id]) frames[b.id].style.height = heights[b.id] + "px";
  try { history.replaceState(null, "", "#" + b.id); } catch (e) {}
  postSize();
}

/* altezza: ogni blocco dice la sua; si ignorano i valori da iframe nascosti */
window.addEventListener("message", e => {
  if (!e.data || !e.data.midtermBanner || !e.data.height || e.data.height < 120) return;
  for (const id in frames){
    if (frames[id].contentWindow === e.source){ heights[id] = e.data.height; frames[id].style.height = e.data.height + "px"; }
  }
  postSize();
});

/* se la pagina è dentro un iframe del sito, comunica la propria altezza totale */
function postSize(){
  try{
    if (window.parent === window) return;
    const h = Math.ceil(document.getElementById("pg").getBoundingClientRect().height);
    window.parent.postMessage({ midtermBanner: true, block: "speciale", height: h }, "*");
  }catch(e){}
}
if (window.ResizeObserver) new ResizeObserver(postSize).observe(document.getElementById("pg"));

/* modalità redazione */
const SCRIPT = '<script>\nwindow.addEventListener("message", function (e) {\n  if (!e.data || !e.data.midtermBanner || !e.data.height) return;\n  document.querySelectorAll("iframe.midterm-frame").forEach(function (f) {\n    if (f.contentWindow === e.source) f.style.height = e.data.height + "px";\n  });\n});\n<\/script>';
const ifr = (src, h, t) => '<iframe class="midterm-frame" src="' + src + '" style="width:100%;border:0;height:' + h + 'px" loading="lazy" title="' + t + '"></iframe>';
function copy(txt, msg){
  const done = () => { const m = document.getElementById("cpMsg"); m.textContent = msg; setTimeout(() => m.textContent = "", 2200); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => prompt("Copia da qui:", txt)); else prompt("Copia da qui:", txt);
}
document.getElementById("cpThis").onclick = () => copy(ifr(base + current.file, current.h, "Midterm Usa 2026, " + current.t), "Iframe copiato");
document.getElementById("cpPage").onclick = () => copy(ifr(base + "midterm-profili.html", 700, "Midterm Usa 2026, chi ha votato e perché"), "Iframe copiato");
document.getElementById("cpScript").onclick = () => copy(SCRIPT, "Script copiato");

/* scheda iniziale: ?tab=camera oppure #camera */
const start = (q.get("tab") || location.hash.slice(1) || "gruppi");
show(BLOCKS.some(b => b.id === start) ? start : "gruppi");
</script>
</body>
</html>
