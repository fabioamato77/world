<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi ha votato chi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e3e3e3;--dem:#1d5fa8;--dem-l:#9db9db;--rep:#c23b2e;--rep-l:#e2a49d;--none:#e8e8e8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink)}
  .box{max-width:820px;margin:0 auto;padding:14px 12px 10px}
  h1{font-family:"Fraunces",serif;font-weight:700;font-size:clamp(19px,4.4vw,26px);line-height:1.1;letter-spacing:-.01em}
  .sub{font-size:clamp(12px,2.8vw,14px);color:var(--muted);margin-top:4px;line-height:1.35}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;font:600 11.5px "IBM Plex Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#fff;border:1px solid #d6d6d6;border-radius:99px;padding:6px 13px;cursor:pointer;transition:background .15s,color .15s}
  .tabs button:hover{background:#f4f4f4}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tabs button:focus-visible{outline:2px solid var(--dem);outline-offset:2px}
  .lead{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(15px,3.6vw,18px);line-height:1.3;margin:12px 0 4px;max-width:640px}
  .legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:10px 0 2px;align-items:center}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
  .foot{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;line-height:1.45}
  .tip{position:fixed;z-index:9;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.14);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.4;max-width:240px;display:none}
  .tip b{font-family:"Fraunces",serif;font-size:14px;display:block;margin-bottom:2px}
  .tip .d{color:var(--dem);font-weight:600} .tip .r{color:var(--rep);font-weight:600}
  @media (prefers-reduced-motion:no-preference){.fadein{animation:fi .6s both}@keyframes fi{from{opacity:0}to{opacity:1}}}

  .row{margin:14px 0 0}
  .rl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:clamp(13px,3.2vw,14.5px);font-weight:500}
  .rl span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);font-weight:500}
  .bar{display:flex;height:clamp(30px,7vw,38px);margin-top:5px;border-radius:5px;overflow:hidden;background:var(--none)}
  .bar i{font-style:normal;display:flex;align-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(13px,3.4vw,16px);color:#fff;padding:0 10px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1);overflow:hidden;white-space:nowrap}
  .bar .d{background:var(--dem);justify-content:flex-start} .bar .r{background:var(--rep);justify-content:flex-end} .bar .o{background:#cfcfcf;padding:0}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="box fadein">
  <h1>Chi ha votato chi</h1>
  <p class="sub">Voto per la Camera alle midterm 2026, per gruppo sociale.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="lead" id="lead"></p>
  <div id="rows"></div>
  <div class="legend"><span><i style="background:var(--dem)"></i>Democratici</span><span><i style="background:var(--rep)"></i>Repubblicani</span><span><i style="background:#cfcfcf"></i>altri e non indicato</span></div>
  <div class="foot"><span id="src"></span><span>Stime sui dati disponibili il 4 novembre</span></div>
</div>
<div class="tip" id="tip"></div>
<script>

const fmtM = m => m == null ? "n.d." : m === 0 ? "pari" : (m > 0 ? "D+" : "R+") + Math.abs(m);
const tip = document.getElementById("tip");
function showTip(html, ev){ tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev){ const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 6) x = ev.clientX - w - 14; if (y + h > innerHeight - 6) y = ev.clientY - h - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px"; }
function hideTip(){ tip.style.display = "none"; }
if (new URLSearchParams(location.search).get("senzatitolo") === "1") { const h = document.querySelector(".box > h1"); if (h) h.style.display = "none"; }
function postSize(){ try{ const h = Math.ceil(document.querySelector(".box").getBoundingClientRect().height);
  if (window.parent !== window) window.parent.postMessage({ midtermBanner:true, block:"yt-gruppi", height:h }, "*"); }catch(e){} }
if (window.ResizeObserver) new ResizeObserver(postSize).observe(document.querySelector(".box"));
function makeTabs(el, names, onPick, start){
  el.innerHTML = ""; names.forEach((n, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.onclick = () => pick(i); el.appendChild(b); });
  function pick(i){ [...el.children].forEach((b, j) => b.classList.toggle("on", i === j)); onPick(i); }
  pick(start || 0);
}

const G = {"Età": {"lead": "Il vantaggio dei Dem è più ampio tra i più giovani: 70% a 28% tra gli under 30, 51% a 47% tra i 45-64enni.", "rows": [["18-29 anni", 70, 28], ["30-44 anni", 62, 36], ["45-64 anni", 51, 47], ["65 anni e più", 52, 47]]}, "Genere": {"lead": "Le donne hanno scelto i Dem con un netto 61% a 38%; tra gli uomini il vantaggio è minimo, 51% a 48%.", "rows": [["Donne", 61, 38], ["Uomini", 51, 48]]}, "Figli": {"lead": "Le donne votano Dem con o senza figli minorenni; tra gli uomini con figli minori prevalgono i Rep, 50% a 46%.", "rows": [["Donne con figli under 18", 58, 39], ["Donne senza figli under 18", 58, 40], ["Uomini con figli under 18", 46, 50], ["Uomini senza figli under 18", 50, 49]], "src": "Fonte: dossier Youtrend, 4 novembre 2026, su voter poll CNN"}, "Etnia": {"lead": "I bianchi premiano di misura i Rep (51% a 48%); i Dem hanno ampie maggioranze tra afroamericani, asiatici e latinos.", "rows": [["Bianchi", 48, 51], ["Afroamericani", 91, 8], ["Latinos", 69, 30], ["Asiatici", 70, 30], ["Altri gruppi", 59, 39]]}, "Residenza": {"lead": "Città contro campagna: i Dem sono nettamente avanti nelle aree urbane (71% a 27%), i Rep in quelle rurali (58% a 40%).", "rows": [["Aree urbane", 71, 27], ["Aree suburbane", 58, 40], ["Piccoli centri e aree rurali", 40, 58]], "src": "Fonte: dossier Youtrend, 4 novembre 2026, su voter poll CNN"}, "Istruzione": {"lead": "I Dem prevalgono con ampio margine tra i laureati (63% a 36%) e di poco anche tra i non laureati (51% a 48%).", "rows": [["Con laurea", 63, 36], ["Senza laurea", 51, 48]]}};
const KEYS = Object.keys(G);
function show(i){
  const g = G[KEYS[i]];
  document.getElementById("lead").textContent = g.lead;
  document.getElementById("src").textContent = g.src || "Fonte: dossier Youtrend, 4 novembre 2026, su dati New York Times (stime Voter Trends)";
  const rows = document.getElementById("rows"); rows.innerHTML = "";
  g.rows.forEach(r => {
    const [name, d, rp] = r, o = Math.max(0, 100 - d - rp), m = d - rp;
    const el = document.createElement("div"); el.className = "row";
    el.innerHTML = '<div class="rl"><b style="font-weight:500">' + name + '</b><span>' + (m === 0 ? "pari" : (m > 0 ? "D+" : "R+") + Math.abs(m)) + '</span></div>' +
      '<div class="bar"><i class="d">' + d + '%</i><i class="o"></i><i class="r">' + rp + '%</i></div>';
    el.querySelector(".bar").onmousemove = ev => showTip("<b>" + name + "</b><span class='d'>Dem " + d + "%</span> · <span class='r'>Rep " + rp + "%</span>" + (o ? "<br>Altri / non indicato " + o + "%" : ""), ev);
    el.querySelector(".bar").onmouseleave = hideTip;
    rows.appendChild(el);
    void el.offsetWidth;
    const [bd, bo, br] = el.querySelectorAll(".bar i");
    requestAnimationFrame(() => { bd.style.width = d + "%"; bo.style.width = o + "%"; br.style.width = rp + "%"; });
  });
  postSize();
}
makeTabs(document.getElementById("tabs"), KEYS, show, Math.max(0, KEYS.indexOf(new URLSearchParams(location.search).get("tab") || "Età")));

postSize();
</script>
</body>
</html>
