<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Spagna al voto 2026 – Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a; --muted:#6b6760; --line:#e2ded5; --track:#ece8df;
    --pp:#4a7fae; --psoe:#b5453f; --vox:#76975a; --sumar:#b0597f; --altri:#aaa59a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);overflow:hidden}

  /* Proporzioni fisse 1280x90 su desktop (1cqw = 12.8px a 1280px), 16:9 su mobile */
  .wrap{container-type:inline-size;width:100%}
  .banner{
    width:100%;aspect-ratio:1280/90;position:relative;
    display:grid;grid-template-columns:22cqw 1fr 1px 25cqw;align-items:center;
    column-gap:1.6cqw;padding:0 1.6cqw;
  }
  .sep{width:1px;height:62%;background:var(--line)}

  /* Titolo */
  .title{display:flex;align-items:center;justify-content:space-between;gap:.6cqw;min-width:0}
  .face{height:6.2cqw;width:auto;flex:none;display:block}
  .title>div{text-align:center}
  .logo{display:block;width:5.4cqw;height:auto;margin:.5cqw auto 0}
  .title h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.95cqw;line-height:1.08;letter-spacing:-.01em}
  .title a.more{display:block;margin-top:.5cqw;font-size:.98cqw;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
  .title a.more:hover,.title a.more:focus-visible{color:#1d5fa8}
  .title a.more[hidden]{display:none}

  /* Colonne */
  .col{min-width:0}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:1.2cqw;margin-bottom:.55cqw}
  .head .status{margin-right:auto}
  .head h2{font-size:.95cqw;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .head .sub{font-family:"IBM Plex Mono",monospace;font-size:.9cqw;color:var(--muted)}
  .bar{position:relative;display:flex;height:1.9cqw;background:var(--track);border-radius:.25cqw;overflow:visible}
  .seg{height:100%;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
  .gap{flex:1 1 0;min-width:0}
  .seg.first{border-radius:.25cqw 0 0 .25cqw}
  .seg.last{border-radius:0 .25cqw .25cqw 0}
  .maj{position:absolute;top:-.45cqw;bottom:-.45cqw;width:0;border-left:.14cqw dashed var(--ink)}
  .legend{display:flex;gap:1cqw;margin-top:.6cqw;white-space:nowrap}
  .legend span{display:inline-flex;align-items:center;gap:.4cqw;font-size:1cqw}
  .legend i{width:.8cqw;height:.8cqw;border-radius:50%;display:inline-block;flex:none}
  .legend i.lg{width:2.3cqw;height:1.7cqw;border-radius:0;background:transparent center/contain no-repeat;box-shadow:none}
  .legend span.hasl{gap:.55cqw}
  .legend b{font-family:"IBM Plex Mono",monospace;font-weight:600}

  /* Riga di stato */
  .lrow{display:flex;justify-content:space-between;align-items:flex-end;gap:1cqw}
  .status{font-family:"IBM Plex Mono",monospace;font-size:.82cqw;color:var(--muted);white-space:nowrap}
  .status.ref{color:#9a5b00}
  .status.m{display:none}

  /* Mobile: 16:9 */
  @container (max-width:640px){
    .banner{aspect-ratio:16/9;grid-template-columns:1fr;grid-template-rows:auto auto auto;align-content:center;
            row-gap:2cqw;padding:2.4cqw 4cqw 7cqw}
    .sep{display:none}
    .face{height:9.5cqw}
    .logo{width:11cqw;margin-top:.6cqw}
    .title{justify-content:space-between}
    .title{gap:3cqw}
    .title h1{font-size:4.9cqw}
    .title a.more{font-size:3cqw;margin-top:1cqw}
    .head{margin-bottom:1.4cqw}
    .head h2{font-size:2.7cqw}
    .head .sub{font-size:2.6cqw}
    .bar{height:5cqw;border-radius:.8cqw}
    .seg.first{border-radius:.8cqw 0 0 .8cqw}.seg.last{border-radius:0 .8cqw .8cqw 0}
    .maj{border-left-width:.4cqw;top:-1.2cqw;bottom:-1.2cqw}
    .legend{gap:1.6cqw;margin-top:2cqw}
    .legend span{font-size:2.8cqw;gap:1cqw}
    .legend i{width:2.2cqw;height:2.2cqw}
    .legend i.lg{width:5cqw;height:3.6cqw;box-shadow:none}
    .legend span.hasl{gap:1cqw}
    .head .status{display:none}
    .status.m{display:block;position:absolute;font-size:2.3cqw;right:4cqw;bottom:2.6cqw}
  }
</style>
</head>

/* ============ RENDER ============ */
function $(id){return document.getElementById(id)}

/* Ordine sull'asse sinistra-destra: PSOE ancorato a sinistra, PP a destra.
   I seggi non ancora assegnati restano come spazio vuoto al centro. */
var LEFT=["PSOE","Sumar"], RIGHT=["Vox","PP"];  // dal bordo verso il centro: PSOE, Sumar | Vox, PP

function orderParties(list){
  var l=[],m=[],r=[];
  LEFT.forEach(function(id){list.forEach(function(p){if(p.id===id)l.push(p)})});
  RIGHT.forEach(function(id){list.forEach(function(p){if(p.id===id)r.push(p)})});
  list.forEach(function(p){if(LEFT.indexOf(p.id)<0&&RIGHT.indexOf(p.id)<0)m.push(p)});
  return {left:l.concat(m), right:r, all:l.concat(m,r)};
}

var _logoCache={};
function withLogo(url,ok){
  var c=_logoCache[url];
  if(c===false) return;
  if(c===true) return ok();
  var im=new Image(); im.onload=function(){_logoCache[url]=true;ok()}; im.onerror=function(){_logoCache[url]=false}; im.src=url;
}

function renderBar(barId, legendId, subId, ch, majId){
  var bar=$(barId), leg=$(legendId), total=ch.total;
  Array.prototype.slice.call(bar.querySelectorAll(".seg,.gap")).forEach(function(n){n.remove()});
  var maj=majId?$(majId):null, o=orderParties(ch.parties);
  function mk(p,cls){
    var d=document.createElement("div"); d.className="seg"+cls; d.style.background=p.color; d.title=p.id+": "+p.seats;
    bar.insertBefore(d,maj);
    requestAnimationFrame(function(){requestAnimationFrame(function(){d.style.width=(p.seats/total*100)+"%"})});
  }
  o.left.forEach(function(p,i){mk(p,i===0?" first":"")});
  var gap=document.createElement("div"); gap.className="gap"; bar.insertBefore(gap,maj);
  o.right.forEach(function(p,i){mk(p,i===o.right.length-1?" last":"")});
  if(maj){maj.style.left="50%"}   // soglia: 176 seggi da una parte = 175 dall'altra
  leg.innerHTML=o.all.map(function(p,i){
    return '<span data-i="'+i+'"><i style="background:'+p.color+'"></i>'+p.id+' <b>'+p.seats+'</b></span>';
  }).join("");
  Array.prototype.forEach.call(leg.children,function(sp,i){
    var p=o.all[i], logo=p.logo||LOGOS[p.id]||""; if(!logo) return;
    withLogo(logo,function(){
      var d=sp.querySelector("i"); d.className="lg"; d.style.cssText="--c:"+p.color+";background-image:url('"+logo.replace(/'/g,"%27")+"')";
      sp.className="hasl";
    });
  });
  var sub=total+" seggi";
  if(ch.majority) sub+=" · maggioranza "+ch.majority;
  $(subId).textContent=sub;
}

function render(d){
  renderBar("congressBar","congressLegend","congressSub",d.congress,"congressMaj");
  renderBar("senateBar","senateLegend","senateSub",d.senate,null);
  var s=$("status"),s2=$("status2");
  if(d.mode==="live"){
    var t=d.updated?new Date(d.updated).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"}):"";
    var txt=(d.scrutinized!=null?String(d.scrutinized).replace(".",",")+"% scrutinato":"")+(t?" · "+t:"");
    s.className="status"; s2.className="status m"; s.textContent=s2.textContent=txt;
  } else {
    var ref="Riferimento: politiche 2023";
    s.className="status ref"; s2.className="status m ref"; s.textContent=s2.textContent=ref;
  }
  sendHeight();
}

function sendHeight(){
  var h=document.getElementById("banner").offsetHeight;
  try{parent.postMessage({elezioniBanner:true,height:h},"*")}catch(e){}
}

function load(){
  fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(render)
    .catch(function(){ if(!load.done) render(FALLBACK) })
    .then(function(){load.done=true});
}

if(LINK_URL){var a=$("more");a.href=LINK_URL;a.hidden=false}
load(); setInterval(load,REFRESH_MS);
window.addEventListener("resize",sendHeight);
