<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>7 ottobre 2023/7 ottobre 2026: la cronologia sulla mappa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Special+Elite&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0D0C0B">
<style>
:root{
  color-scheme:dark;
  --bg:#0D0C0B;--panel:#171413;--ink:#E8E0D0;--muted:#A1978A;--rule:#3B3530;
  --sea:#080A0C;--land:#2A2420;--line:#5A5044;--pal:#40332A;
  --mil:#E5513F;--dip:#86A9B3;--lead:#B08FC4;--um:#CC9A33;
  --f-head:'IM Fell English','Iowan Old Style',Georgia,'Times New Roman',serif;
  --f-body:'Source Serif 4',Charter,Georgia,'Times New Roman',serif;
  --f-mono:'Special Elite','Courier New',Courier,monospace;
  --grain:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27240%27 height=%27240%27%3E%3Cfilter id=%27n%27 x=%270%27 y=%270%27 width=%27100%25%27 height=%27100%25%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.8%27 numOctaves=%272%27 stitchTiles=%27stitch%27/%3E%3CfeColorMatrix type=%27matrix%27 values=%270 0 0 0 .92  0 0 0 0 .88  0 0 0 0 .8  0 0 0 1.4 -.35%27/%3E%3C/filter%3E%3Crect width=%27240%27 height=%27240%27 filter=%27url%28%23n%29%27/%3E%3C/svg%3E");
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
::selection{background:var(--mil);color:#FBF4E6}
body{margin:0;color:var(--ink);font:17px/1.55 var(--f-body);background:radial-gradient(120% 60% at 50% -8%,#221914 0%,var(--bg) 62%) no-repeat,var(--bg);border-top:6px solid #8E1F16}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none}
body::before{z-index:60;background-image:var(--grain);opacity:.13}
body::after{z-index:59;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.55) 100%)}
.wrap{max-width:1200px;margin:0 auto;padding:26px 16px 52px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:18px;border-bottom:3px double var(--line)}
h1{min-width:0;font:400 clamp(30px,5.4vw,58px)/1.02 var(--f-head);letter-spacing:.005em;margin:0;text-shadow:2px 1px 0 rgba(229,81,63,.38)}
.dt{display:inline-block}
.logo{flex:none;display:block;width:clamp(110px,18vw,170px);background:#D9D0BD;padding:6px 9px;line-height:0;box-shadow:0 2px 0 rgba(0,0,0,.7),0 8px 24px rgba(0,0,0,.5)}
.logo img{width:100%;height:auto;display:block}
.intro{max-width:64ch;color:var(--muted);margin:0}
.intro b{color:var(--ink);font-weight:600}
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:18px;margin-top:26px}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:1px solid var(--line);overflow:hidden;background:var(--sea);aspect-ratio:4/3;min-height:300px;box-shadow:0 0 0 1px #000,0 14px 44px rgba(0,0,0,.65)}
.mapbox::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 90px 18px rgba(0,0,0,.7)}
@media (max-width:860px){.mapbox{aspect-ratio:5/4;min-height:0}}
#map{position:absolute;inset:0;display:block;width:100%;height:100%}
#map{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#map.grab{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:0;cursor:pointer;display:grid;place-items:center;padding:0;font:500 22px/1 var(--f-body)}
.zoom button:hover{border-color:var(--muted);background:#221D1A}
@media (max-width:860px){.zoom{flex-direction:row}}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;background:rgba(13,12,11,.9);color:var(--ink);border:1px solid var(--line);padding:7px 12px;font:13px var(--f-mono);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.hint.on{opacity:1}
.zoom svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c{fill:var(--land);stroke:var(--line);stroke-width:.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.c.pal{fill:var(--pal)}
.lbl{font-family:var(--f-head);letter-spacing:.05em;fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
.lbl.sea{font-style:italic;fill:#7F8A91;stroke:var(--sea)}
.lbl.city{fill:var(--ink)}
.cityd{fill:var(--ink)}
.past{cursor:pointer}
.offmap{position:absolute;left:10px;top:10px;z-index:3;background:var(--panel);border:1px solid var(--line);padding:5px 10px;font:13px var(--f-mono);display:none;align-items:center;gap:6px}
.offmap.on{display:inline-flex}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
.arrowh{opacity:0;animation:fadein .2s .8s forwards}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.9s ease-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .draw{animation:none;stroke-dashoffset:0}.arrowh{animation:none;opacity:1}.ring{animation:none;opacity:.3}
}
.card{background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--c,var(--mil));padding:20px 22px 24px;display:flex;flex-direction:column;gap:10px;min-height:320px;box-shadow:inset 0 0 46px rgba(0,0,0,.55),0 14px 40px rgba(0,0,0,.5)}
.when{font:15px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--c,var(--muted))}
.cat{display:inline-flex;align-items:center;gap:8px;font:13px var(--f-mono);color:var(--muted)}
.cat i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.card h2{font:400 clamp(27px,3.2vw,38px)/1.08 var(--f-head);margin:4px 0 2px;letter-spacing:.005em}
.card p{margin:0;max-width:60ch}
.links{display:flex;flex-direction:column;gap:4px;font-size:16px}
.links a{color:var(--dip);text-underline-offset:3px;width:fit-content}
.links a:hover{text-decoration-thickness:2px;color:var(--ink)}
.note{font-size:14px;font-style:italic;color:var(--muted);margin-top:auto}
.bar{margin-top:16px;background:var(--panel);border:1px solid var(--rule);padding:12px 14px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.btns{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit}
.ib{width:38px;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:0;display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{border-color:var(--muted)}
.ib.play{width:44px;height:44px;background:var(--mil);color:#FBF4E6;border-color:var(--mil)}
.ib svg{width:18px;height:18px;fill:currentColor}
.track{flex:1 1 300px;min-width:0}
.ticks{display:flex;gap:2px;height:30px;align-items:flex-end}
.tick{flex:1;min-width:0;height:12px;padding:0;border:0;background:var(--c);opacity:.32;cursor:pointer;transition:height .15s,opacity .15s}
.tick.done{opacity:.8}
.tick[aria-current="true"]{height:30px;opacity:1;box-shadow:0 0 10px var(--c)}
.years{position:relative;height:18px;margin-top:5px;font:12px/18px var(--f-mono);color:var(--muted)}
.years span{position:absolute;top:0}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;background:var(--bg);padding:7px 12px;font:13px var(--f-mono);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font:14px var(--f-mono);color:var(--muted);min-width:5ch;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:16px 2px 0;font:13px var(--f-mono);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
details{margin-top:24px;border-top:3px double var(--line);padding-top:12px}
summary{cursor:pointer;font:400 22px var(--f-head);padding:6px 0}
.list h3{font:14px var(--f-mono);letter-spacing:.08em;color:var(--mil);margin:20px 0 6px}
.list button{display:grid;grid-template-columns:200px 1fr;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;cursor:pointer}
.list button:hover{background:var(--panel)}
.list .d{font:13px/1.5 var(--f-mono);color:var(--muted)}
@media (max-width:560px){.list button{grid-template-columns:1fr;gap:0}}
.foot{margin-top:28px;font-size:14px;font-style:italic;color:var(--muted);max-width:75ch}
:focus-visible{outline:2px solid var(--dip);outline-offset:2px}
</style>
</head>

    cancelAnimationFrame(anim);const r=normalize();if(!r)return;
    vb.x-=(e.clientX-prev.x)/r.width*vb.w;vb.y-=(e.clientY-prev.y)/r.height*vb.h;clampPan();render();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinchD=0;
  if(ptrs.size===0){dragStart=null;svg.classList.remove('grab');if(moved){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);}}
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
$('zin').addEventListener('click',()=>zoomCenter(.6));
$('zout').addEventListener('click',()=>zoomCenter(1/.6));
$('zreset').addEventListener('click',resetView);
if(window.ResizeObserver)new ResizeObserver(()=>render()).observe(svg);
addEventListener('resize',()=>render());
addEventListener('load',()=>{render();setTimeout(render,300);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
/* modalita' incorporata (?embed=1) */
let hintEl=null,hintT=0;
function hint(){
  if(!hintEl){hintEl=document.createElement('div');hintEl.className='hint';hintEl.setAttribute('role','status');
    hintEl.textContent=(/Mac|iPhone|iPad/.test(navigator.userAgent)?'\u2318':'Ctrl')+' + rotella per ingrandire';
    document.querySelector('.mapbox').appendChild(hintEl);}
  hintEl.classList.add('on');clearTimeout(hintT);hintT=setTimeout(()=>hintEl.classList.remove('on'),1400);
}
function touchMode(){
  if(!EMBED)return;
  const t=viewRect(lastKey);
  svg.style.touchAction=(vb.w>t.w*.9)?'pan-y':'none';
}
if(EMBED){
  let last=0,raf=0;
  const send=()=>{raf=0;const h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h&&h!==last){last=h;parent.postMessage({type:'fq-embed-height',height:h},'*');}};
  const queue=()=>{if(!raf)raf=requestAnimationFrame(send);};
  if(window.ResizeObserver)new ResizeObserver(queue).observe(document.documentElement);
  addEventListener('load',queue);addEventListener('resize',queue);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(queue);
  queue();
}
setView(EV[0].v,true);
select(0);
</script>
